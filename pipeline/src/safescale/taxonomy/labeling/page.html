<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazard Labeling</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e2e0da;
    --accent: #c2410c; --accent-soft: #fff1e8; --ok: #15803d; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1d; --ink: #ecebe7; --muted: #a09e98; --line: #34332f;
      --accent: #fb923c; --accent-soft: #3a2416; --ok: #4ade80; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  .progress { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .status { font-size: 13px; color: var(--muted); min-width: 70px; text-align: right; }
  .status.ok { color: var(--ok); } .status.err { color: var(--accent); }
  main {
    max-width: 1100px; margin: 0 auto; padding: 16px;
    display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px;
  }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  .meta a { color: var(--accent); }
  h2 { font-size: 19px; line-height: 1.3; margin: 6px 0 14px; }
  .field { margin-bottom: 14px; }
  .field h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 4px;
  }
  .field p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .field .empty { color: var(--muted); font-style: italic; }
  .hazard p { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; }
  .cats { display: grid; gap: 6px; }
  label.cat {
    display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: start;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  label.cat:hover { border-color: var(--muted); }
  label.cat.on { border-color: var(--accent); background: var(--accent-soft); }
  label.cat input { margin: 3px 0 0; }
  label.cat .name { font-weight: 600; }
  label.cat .key { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  label.cat .desc { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
  .divider { border-top: 1px solid var(--line); margin: 12px 0; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  }
  nav { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .warn { color: var(--warn); font-size: 13px; min-height: 1.2em; margin-top: 6px; }
  .done { text-align: center; padding: 40px 16px; }
</style>
</head>
<body>
<header>
  <h1>Hazard labeling · blind gold set</h1>
  <div class="progress"><span id="count">–</span><div class="bar"><div id="bar"></div></div></div>
  <span class="status" id="status"></span>
</header>
<main id="app"><p>Loading…</p></main>

<script>
"use strict";
const KEYS = "1234567890qw";  // one shortcut per category, in order
let categories = [], items = [], index = 0, notesTimer = null;
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v; else if (k in node) node[k] = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c);  // strings become text nodes: never parsed as HTML
  return node;
}

function setStatus(text, kind = "") { const s = $("status"); s.textContent = text; s.className = "status " + kind; }

function updateProgress() {
  const done = items.filter((i) => i.labels.length > 0).length;
  $("count").textContent = `${done} / ${items.length} labeled`;
  $("bar").style.width = `${(100 * done) / Math.max(items.length, 1)}%`;
}

function field(title, text, extraClass = "") {
  return el("div", { class: "field " + extraClass }, el("h3", {}, title),
    text ? el("p", {}, text) : el("p", { class: "empty" }, "(none)"));
}

function render() {
  const item = items[index];
  const app = $("app");
  app.replaceChildren();
  const left = el("section", { class: "panel" },
    el("div", { class: "meta" },
      el("span", {}, `Recall ${index + 1} of ${items.length}`),
      el("span", {}, `ID ${item.recall_id}`),
      el("span", {}, item.recall_date || ""),
      el("a", { href: item.url, target: "_blank", rel: "noopener noreferrer" }, "CPSC page ↗")),
    el("h2", {}, item.title),
    field("Hazard", item.hazard_text, "hazard"),
    field("Description", item.description));

  const cats = el("div", { class: "cats" });
  categories.forEach((c, i) => {
    const box = el("input", { type: "checkbox", checked: item.labels.includes(c.code) });
    box.dataset.code = c.code;
    box.addEventListener("change", () => toggle(c.code, box.checked));
    cats.append(el("label", { class: "cat" + (box.checked ? " on" : "") },
      box, el("span", { class: "name" }, c.label), el("span", { class: "key" }, KEYS[i] || ""),
      el("span", { class: "desc" }, c.description)));
  });

  const std = el("input", { type: "checkbox", checked: item.violates_standard, id: "std" });
  std.addEventListener("change", () => { item.violates_standard = std.checked; save(); });
  const notes = el("textarea", { id: "notes", placeholder: "Notes (optional): unsure, ambiguous wording…" });
  notes.value = item.notes;
  notes.addEventListener("input", () => {
    item.notes = notes.value; clearTimeout(notesTimer); notesTimer = setTimeout(save, 600);
  });

  const prev = el("button", { disabled: index === 0, onclick: () => go(index - 1) }, "← Back");
  const next = el("button", { class: "primary", disabled: index === items.length - 1, onclick: () => go(index + 1) }, "Next →");
  const jump = el("button", { onclick: nextUnlabeled }, "Next unlabeled (n)");

  const right = el("section", { class: "panel" },
    el("div", { class: "field" }, el("h3", {}, "Hazard categories (tick every one that applies)")), cats,
    el("div", { class: "warn", id: "warn" }),
    el("div", { class: "divider" }),
    el("label", { class: "cat" + (item.violates_standard ? " on" : "") }, std,
      el("span", { class: "name" }, "Violates a standard"), el("span", { class: "key" }, "s"),
      el("span", { class: "desc" }, "The text says it fails a mandatory or voluntary safety standard.")),
    el("div", { class: "field", style: "margin-top:12px" }, el("h3", {}, "Notes"), notes),
    el("nav", {}, prev, next, jump),
    el("p", { class: "hint" }, "Keys: 1–0, q, w toggle categories · s standard · ← → move · n next unlabeled. Every change saves."));
  app.append(left, right);
  updateProgress();
}

function toggle(code, on) {
  const item = items[index];
  let labels = new Set(item.labels);
  if (on) {
    if (code === "other") labels = new Set(["other"]);   // 'other' excludes everything else
    else { labels.delete("other"); labels.add(code); }
  } else labels.delete(code);
  item.labels = categories.map((c) => c.code).filter((c) => labels.has(c));
  save(); render();
}

async function save() {
  const item = items[index];
  setStatus("Saving…");
  try {
    const res = await fetch(`/api/items/${item.recall_id}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ labels: item.labels, violates_standard: item.violates_standard, notes: item.notes }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    Object.assign(item, body);
    setStatus("Saved ✓", "ok");
  } catch (err) { setStatus("Not saved: " + err.message, "err"); }
  updateProgress();
}

function go(i) {
  if (i < 0 || i >= items.length) return;
  const w = $("warn");
  if (items[index].labels.length === 0 && i > index && w && !w.dataset.shown) {
    w.textContent = "No category ticked yet. Tick one (or Other), or press again to skip for now.";
    w.dataset.shown = "1"; return;
  }
  clearTimeout(notesTimer);
  index = i; location.hash = String(items[index].recall_id); render(); window.scrollTo(0, 0);
}

function nextUnlabeled() {
  for (let step = 1; step <= items.length; step++) {
    const i = (index + step) % items.length;
    if (items[i].labels.length === 0) { index = i; location.hash = String(items[i].recall_id); render(); return; }
  }
  $("app").replaceChildren(el("section", { class: "panel done", style: "grid-column:1/-1" },
    el("h2", {}, "All recalls are labeled 🎉"),
    el("p", {}, "Your labels are saved in evaluation/hazard_gold/gold.json. You can close this tab."),
    el("button", { onclick: render }, "Review")));
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = KEYS.indexOf(e.key);
  if (i >= 0 && i < categories.length) {
    const code = categories[i].code; toggle(code, !items[index].labels.includes(code));
  } else if (e.key === "s") { items[index].violates_standard = !items[index].violates_standard; save(); render(); }
  else if (e.key === "ArrowRight") go(index + 1);
  else if (e.key === "ArrowLeft") go(index - 1);
  else if (e.key === "n") nextUnlabeled();
});

(async function init() {
  try {
    const res = await fetch("/api/gold");
    ({ categories, items } = await res.json());
  } catch (err) { $("app").textContent = "Could not load the sample: " + err.message; return; }
  const fromHash = items.findIndex((i) => String(i.recall_id) === location.hash.slice(1));
  const firstOpen = items.findIndex((i) => i.labels.length === 0);
  index = fromHash >= 0 ? fromHash : Math.max(firstOpen, 0);
  render();
})();
</script>
</body>
</html>
